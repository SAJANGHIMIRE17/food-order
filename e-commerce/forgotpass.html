
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your FoodieHub account password.">
    <title>Forgot Password | FoodieHub</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Foodie<span>Hub</span>
            </a>

            <a href="login.html" class="nav-button">Back to Login</a>
        </nav>
    </header>

    <main class="login-page">
        <section class="login-card">
            <p class="eyebrow">ACCOUNT RECOVERY</p>

            <h1>Forgot Password?</h1>

            <p class="login-description">
                Enter your email address and we'll help you reset your password.
            </p>

            <form action="#" method="post" class="login-form">
                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Foodiehub@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="login-submit">
                    Reset Password
                </button>
            </form>

            <p class="back-link">
                <a href="login.html">← Back to Login</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">
            Foodie<span>Hub</span>
        </a>

        <p>&copy; 2026 FoodieHub. All rights reserved.</p>
    </footer>

</body>
</html>
