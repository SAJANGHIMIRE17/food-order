
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your FoodieHub account.">

    <title>Login | FoodieHub</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Header and Navigation -->
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">
                Foodie<span>Hub</span>
            </a>

            <a href="index.html" class="nav-button">
                Back to Home
            </a>
        </nav>
    </header>

    <!-- Login Form -->
    <main class="login-page">
        <section class="login-card">

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Login to FoodieHub</h1>

            <p class="login-description">
                Sign in to order your favourite food.
            </p>

            <form action="#" method="post" class="login-form">

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Foodiehub@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Login Options -->
                <div class="login-options">

                    <label class="remember-label">
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="forgotpass.html">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <!-- Registration Link -->
            <p class="signup-text">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <!-- Return to Home -->
            <p class="back-link">
                <a href="index.html">← Continue browsing</a>
            </p>

        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">

        <a href="index.html" class="logo">
            Foodie<span>Hub</span>
        </a>

        <p>&copy; 2026 FoodieHub. All rights reserved.</p>

    </footer>

</body>
</html>
